name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute version tags
        id: tags
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION#*.}"
          MINOR="${MINOR%%.*}"
          echo "tags=v${VERSION},v${MAJOR}.${MINOR},v${MAJOR},latest" >> "$GITHUB_OUTPUT"

      # Java with FFmpeg (docker/base), which the collection player runs: built for both platforms, then the app's
      # image is built on exactly what was pushed. Jib pulls it with this login.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push base image
        id: base
        uses: docker/build-push-action@v6
        with:
          context: docker/base
          platforms: linux/amd64,linux/arm64
          push: true
          # A plain list of the two platforms' images, as Jib reads a base: no attestations beside them.
          provenance: false
          tags: ghcr.io/skjaere/debridav-base:java25-ffmpeg8.0.1

      - name: Build and push Docker image
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: >-
          ./gradlew jib
          -Pversion=${{ needs.release-please.outputs.version }}
          -Djib.from.image=ghcr.io/skjaere/debridav-base@${{ steps.base.outputs.digest }}
          -Djib.to.tags=${{ steps.tags.outputs.tags }}
